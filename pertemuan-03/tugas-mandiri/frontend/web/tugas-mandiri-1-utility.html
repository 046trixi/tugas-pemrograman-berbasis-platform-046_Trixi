
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Profil - Utility First</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-100 p-4">
    <main class="w-full max-w-sm">
        <article class="overflow-hidden rounded-2xl bg-white shadow-lg ring-1 ring-slate-200">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 px-6 py-8 text-center">
                <img
                    class="mx-auto h-28 w-28 rounded-full border-4 border-white object-cover shadow-md"
                    src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&h=300&q=80"
                    alt="Foto profil Citra"
                >
                <h1 class="mt-4 text-2xl font-bold tracking-tight text-white">Citra</h1>
                <p class="mt-1 text-sm text-blue-100">NIM: 2026002</p>
            </div>

            <section class="p-6 text-center">
                <p class="text-sm text-slate-600">Mahasiswa Program Studi Informatika.</p>
                <button
                    type="button"
                    class="mt-4 w-full rounded-xl bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                >
                    Lihat Profil
                </button>
                <p class="mt-5 text-xs text-slate-400">Kartu Profil Mahasiswa</p>
            </section>
        </article>
    </main>
</body>
</html>
