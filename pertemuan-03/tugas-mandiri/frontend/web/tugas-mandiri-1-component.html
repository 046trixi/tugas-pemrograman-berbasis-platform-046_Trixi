
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Profil - Component Based</title>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: #f1f5f9; font-family: Arial, sans-serif; }
        .card { width: 100%; max-width: 360px; overflow: hidden; border-radius: 18px; background: #fff; box-shadow: 0 12px 30px rgba(15, 23, 42, .12); }
        .card-header { padding: 28px 24px; text-align: center; background: linear-gradient(135deg, #2563eb, #4f46e5); }
        .profile-photo { width: 112px; height: 112px; object-fit: cover; border: 4px solid #fff; border-radius: 50%; }
        .name { margin: 16px 0 4px; color: #fff; font-size: 24px; }
        .nim { margin: 0; color: #dbeafe; font-size: 14px; }
        .card-body { padding: 24px; text-align: center; }
        .description { margin: 0; color: #475569; font-size: 14px; }
        .btn { display: block; width: 100%; margin-top: 16px; padding: 12px 16px; border: 0; border-radius: 12px; background: #2563eb; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
        .btn:hover { background: #1d4ed8; }
        .footer { margin-top: 20px; color: #94a3b8; font-size: 12px; }
        @media (max-width: 360px) { body { padding: 12px; } .card-header { padding: 24px 16px; } .card-body { padding: 20px 16px; } }
    </style>
</head>
<body>
    <main class="card">
        <div class="card-header">
            <img
                class="profile-photo"
                src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&h=300&q=80"
                alt="Foto profil Citra"
            >
            <h1 class="name">Citra</h1>
            <p class="nim">NIM: 2026002</p>
        </div>

        <div class="card-body">
            <p class="description">Mahasiswa Program Studi Informatika.</p>
            <button class="btn" type="button">Lihat Profil</button>
            <p class="footer">Kartu Profil Mahasiswa</p>
        </div>
    </main>
</body>
</html>
